kind = "web"
previewPath = "/"
title = "AuditIQ — AI-Powered Journal Entry Risk Scorer"
version = "1.0.0"
id = "artifacts/auditiq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18868

[services.development]
run = "pnpm --filter @workspace/auditiq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auditiq", "run", "build" ]
publicDir = "artifacts/auditiq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18868"
BASE_PATH = "/"

[[services]]
name = "Fraud Evaluation"
paths = ["/fraud-evaluation"]
localPort = 5000

[services.development]
run = "uv run streamlit run fraud_evaluation/app.py --server.address 0.0.0.0 --server.port $PORT --server.baseUrlPath fraud-evaluation --server.headless true --browser.gatherUsageStats false"

[services.production.build]
args = ["uv", "sync", "--frozen", "--no-dev"]

[services.production.run]
args = ["uv", "run", "--frozen", "streamlit", "run", "artifacts/auditiq/fraud_evaluation/app.py", "--server.address", "0.0.0.0", "--server.port", "5000", "--server.baseUrlPath", "fraud-evaluation", "--server.headless", "true", "--browser.gatherUsageStats", "false"]

[services.production.run.env]
PORT = "5000"

[services.production.health.startup]
path = "/fraud-evaluation/_stcore/health"
